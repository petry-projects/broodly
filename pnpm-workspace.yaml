packages:
  - "apps/*"
  - "packages/*"

overrides:
  '@xmldom/xmldom': '>=0.9.12'
  postcss: '>=8.5.18'
  brace-expansion: '>=5.0.12'
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  js-yaml: '>=4.3.2'
  '@babel/core': ^7.29.6
  'lodash@>=4.0.0 <=4.17.23': '>=4.18.0'
  tmp: '>=0.2.6'
  uuid: '>=11.1.1'
  '@tootallnate/once@<3.0.1': '>=3.0.1'
  '@ungap/structured-clone@<1.3.1': '>=1.3.1'
  shell-quote: '>=1.8.5'
  nanoid: '>=3.3.17 <4'
  browserslist: '>=4.28.7'
  '@humanfs/node': '>=0.16.8'
  postcss-selector-parser: '>=6.1.3 <7'

# image-size <= 2.0.2 has two high-severity DoS advisories (ICNS and JXL/HEIF
# parsers). The patched version (>= 2.0.3) has not been published to npm yet.
# Metro (React Native bundler) pins image-size@1.2.1 which falls in the
# affected range. These are suppressed until image-size 2.0.3+ is available.
# Re-evaluate when: https://github.com/image-size/image-size/releases shows >= 2.0.3
#
# node-forge <= 1.4.0 (GHSA-86w9-cpqp-85rv, RSA PKCS#1 v1.5 signature
# verification bypass) reaches us transitively via expo/@expo/cli. The patched
# version (>= 1.4.1) is not yet published to npm (registry latest is 1.4.0).
# Suppressed until the patch lands, at which point an override can be added
# and the lockfile regenerated.
# Re-evaluate when: npm view node-forge version shows >= 1.4.1
#
# braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm, stack-exhaustion DoS through deeply
# nested patterns) reaches us transitively via metro (React Native bundler) ->
# micromatch -> braces, a build-time path only. The patched version (>= 3.0.4)
# is not yet published to npm (registry latest is 3.0.3), so no override can
# resolve it. Suppressed until the patch lands, at which point an override can
# be added and the lockfile regenerated.
# Re-evaluate when: npm view braces version shows >= 3.0.4
audit:
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
